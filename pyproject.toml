[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyepi"
version = "0.7.0"
description = "Easyepi: a unified bulk epigenomics downstream analysis suite (CUT&Tag / CUT&RUN / ChIP-seq / ATAC-seq / MNase-seq)"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "houwb" }]
keywords = ["epigenomics", "CUT&Tag", "ChIP-seq", "ATAC-seq", "MNase", "peak", "nucleosome"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Core runtime dependencies
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# `bam` covers both readers: nothing in the suite reads a BAM without also
# needing BigWig signal, and a two-extra install was the first thing users
# got wrong. `bigwig` stays as a standalone alias for the track reader.
bam = ["pysam>=0.22", "pyBigWig>=0.3.22"]
bigwig = ["pyBigWig>=0.3.22"]
# matplotlib is only imported when a figure is requested.
# scikit-learn is used by the track clustering in `easyepi integrate`; without it
# that feature raised ModuleNotFoundError in a `[viz]` environment.
viz = ["matplotlib>=3.7", "scikit-learn>=1.3"]
# hmmlearn is only needed by `easyepi histone-states`.
states = ["hmmlearn>=0.3"]
# The built-in TOBIAS ports (`easyepi footprint --engine port`, and the
# BINDetect/ATACorrect helpers) keep the reference implementation's own
# dependencies instead of hiding them behind a pure-Python substitute:
# scikit-learn for the GMM threshold, MOODS for the p-value scan.
# Installed by the clean-venv release check: without this extra,
# `tobias_bindetect_stats` raised ModuleNotFoundError on import.
tobias = ["scikit-learn>=1.3", "mira-moods>=1.9"]
# `easyepi/activity.py` handles both API generations: 1.9.x (`dc.run_ulm`) and
# 2.x (`dc.mt.ulm`). decoupler 1.9.2 declares `Requires-Python <3.12` while 2.x
# needs >=3.10, so one range covers every supported interpreter and the marker
# that used to exclude 3.12 is no longer needed.
#
# `anndata` is listed because decoupler imports it while loading; without it the
# extra installed and then raised ModuleNotFoundError: anndata.
activity = ["decoupler>=1.9.2,<3", "anndata"]
motif = ["biopython>=1.81"]
dev = ["pytest>=8", "build>=1.2", "mkdocs>=1.6",
       "mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]
# Multi-track clustering uses scikit-learn only; statsmodels is not imported
# anywhere in the package and is intentionally not listed.
stats = ["scikit-learn>=1.3"]
# `easyepi diff --method deseq2` needs pydeseq2. Without an extra it had to be
# installed by hand, so a clean install could not run its own documented model
# and the runtime message pointed at pip/conda instead of at this project.
#
# The sign convention of the reported statistic is part of this contract and is
# stated where it is produced (`differential/deseq2.py`): log2(A / B), so a
# feature that doubles in group B reports about -1.
deseq2 = ["pydeseq2>=0.5"]
# `all` must union every extra above. It listed neither `hmmlearn` (states) nor
# `matplotlib` (viz), so `pip install easyepi[all]` left `histone-states` raising
# ModuleNotFoundError, and docs promised the opposite. Keep the two lists in step:
# tests/test_release_metadata.py asserts it.
all = [
    "pysam>=0.22",
    "pyBigWig>=0.3.22",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "hmmlearn>=0.3",
    "biopython>=1.81",
    "pydeseq2>=0.5",
    "decoupler>=1.9.2,<3",
    "anndata",
    "mira-moods>=1.9",
]

# External programs, declared so a caller can read the requirement instead of
# discovering it from a stack trace. These are deliberately NOT extras: `pip`
# cannot install MACS3 (a conda/bioconda package in practice) or HOMER, so an
# extra that claims to would fail at install time and mislead. The values are the
# versions this suite was exercised against; `easyepi doctor` style checks are
# not implemented yet.
[tool.easyepi.external]
"macs3" = ">=3.0,<4"          # easyepi peaks (imported as a Python package)
"homer" = ">=4.11"            # easyepi motifs, de novo discovery (-mknown)
"meme-suite" = ">=5.5"        # easyepi motifs --pwm comparison oracle only
"TOBIAS" = ">=0.17.5"         # easyepi footprint --engine tobias
"chromhmm" = ">=1.23"         # easyepi chromhmm (external jar)
"samtools" = ">=1.13"         # convenience: faidx for --genome-fasta
"dss" = ">=2.58"              # R package, tests/oracle only

# Modules that ship inside the package but are not on any runtime code path.
# `easyepi/dmr_r.py` launches Rscript to test the beta-binomial port against the
# real DSS; no `easyepi` subcommand imports it. Recording it here keeps the
# "separate test scaffolding from product code" promise checkable instead of
# living only in a document: tests/test_release_metadata.py asserts this table and
# asserts the module has no hardcoded workstation path.
[tool.easyepi.classification]
test_bridge = ["easyepi.dmr_r"]

[project.scripts]
easyepi = "easyepi.cli:main"

[project.urls]
Homepage = "https://github.com/summus-kong/easyepi"
Repository = "https://github.com/summus-kong/easyepi"
Documentation = "https://summus-kong.github.io/easyepi/"
Changelog = "https://github.com/summus-kong/easyepi/blob/main/CHANGELOG.md"
Issues = "https://github.com/summus-kong/easyepi/issues"
[tool.setuptools.packages.find]
include = ["easyepi*"]
exclude = ["easyepi.python*", "easyepi.backends*", "easyepi.scripts*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dss: compares against the real DSS package through its R oracle; excluded in CI where R is absent",
]

[tool.setuptools]
include-package-data = false
