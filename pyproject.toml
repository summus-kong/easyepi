[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyepi"
version = "0.5.2"
description = "Easyepi: a unified bulk epigenomics downstream analysis suite (CUT&Tag / CUT&RUN / ChIP-seq / ATAC-seq / MNase-seq)"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "houwb" }]
keywords = ["epigenomics", "CUT&Tag", "ChIP-seq", "ATAC-seq", "MNase", "peak", "nucleosome"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Core runtime dependencies
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# `bam` covers both readers: nothing in the suite reads a BAM without also
# needing BigWig signal, and a two-extra install was the first thing users
# got wrong. `bigwig` stays as a standalone alias for the track reader.
bam = ["pysam>=0.22", "pyBigWig>=0.3.22"]
bigwig = ["pyBigWig>=0.3.22"]
# matplotlib is only imported when a figure is requested.
# scikit-learn is used by the track clustering in `easyepi integrate`; without it
# that feature raised ModuleNotFoundError in a `[viz]` environment.
viz = ["matplotlib>=3.7", "scikit-learn>=1.3"]
# hmmlearn is only needed by `easyepi histone-states`.
states = ["hmmlearn>=0.3"]
# `easyepi/activity.py` handles both API generations: 1.9.x (`dc.run_ulm`) and
# 2.x (`dc.mt.ulm`). decoupler 1.9.2 declares `Requires-Python <3.12` while 2.x
# needs >=3.10, so one range covers every supported interpreter and the marker
# that used to exclude 3.12 is no longer needed.
#
# `anndata` is listed because decoupler imports it while loading; without it the
# extra installed and then raised ModuleNotFoundError: anndata.
activity = ["decoupler>=1.9.2,<3", "anndata"]
motif = ["biopython>=1.81"]
dev = ["pytest>=8", "build>=1.2", "mkdocs>=1.6",
       "mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]
# Multi-track clustering uses scikit-learn only; statsmodels is not imported
# anywhere in the package and is intentionally not listed.
stats = ["scikit-learn>=1.3"]
all = [
    "pysam>=0.22",
    "pyBigWig>=0.3.22",
    "decoupler>=1.9.2,<3",
    "anndata",
    "biopython>=1.81",
    "scikit-learn>=1.3",
]

[project.scripts]
easyepi = "easyepi.cli:main"

[project.urls]
Homepage = "https://github.com/summus-kong/easyepi"
Repository = "https://github.com/summus-kong/easyepi"
Documentation = "https://summus-kong.github.io/easyepi/"
Changelog = "https://github.com/summus-kong/easyepi/blob/main/CHANGELOG.md"
Issues = "https://github.com/summus-kong/easyepi/issues"
[tool.setuptools.packages.find]
include = ["easyepi*"]
exclude = ["easyepi.python*", "easyepi.backends*", "easyepi.scripts*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = false
