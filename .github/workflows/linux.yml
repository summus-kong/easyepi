name: Linux verification

# The previous version of this workflow had never executed: it installed extras
# (stats, motif, activity) and a pinned numba that do not exist, and it ran only
# maintenance/verify_linux.py, never the test suite. It is rewritten here around what
# the package actually provides, and the test suite is the primary check.
#
# pyproject extras after this change: core (implicit), bam, bigwig, viz, states, dev.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package with every optional extra
        run: |
          python -m pip install --upgrade pip
          # every extra, so the suite runs with pysam/pyBigWig/matplotlib/hmmlearn
          # present rather than silently skipping the tests that need them
          python -m pip install -e ".[bam,viz,states,dev]"

      - name: Report what was actually installed
        # A green run against a different dependency set is not reproducible, so the
        # resolved versions go into the log and the artifact.
        run: |
          python -c "import sys; print('python', sys.version)"
          python -m pip list --format=freeze | grep -Ei 'numpy|scipy|pandas|matplotlib|pysam|pybigwig|hmmlearn|pytest' || true

      - name: Test suite
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests -q

      - name: CLI surface and module imports
        env:
          MPLBACKEND: Agg
        run: python maintenance/verify_linux.py

      - name: Check that no test was silently skipped
        # The suite contains pysam-dependent tests; with the extras installed they
        # must run. A large skip count means the environment is wrong.
        env:
          MPLBACKEND: Agg
        run: |
          python -m pytest tests -q -rs 2>&1 | tee /tmp/pytest_skips.txt
          SKIPPED=$(grep -cE '^SKIPPED' /tmp/pytest_skips.txt || true)
          echo "skipped: ${SKIPPED:-0}"
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo "::warning::${SKIPPED} test(s) skipped; inspect the artifact"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-verification-py${{ matrix.python }}
          path: .verification/linux
          if-no-files-found: warn
