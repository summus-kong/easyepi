name: Linux verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.6" "scipy==1.15.3" "pandas==2.2.3" "matplotlib>=3.9" "numba==0.61.2"
          python -m pip install -e ".[dev,stats,motif,bam,bigwig,activity]"
      - name: Verify imports, readers, ULM and script entry points
        env:
          MPLBACKEND: Agg
        run: python maintenance/verify_linux.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-verification-${{ matrix.python }}
          path: .verification/linux
