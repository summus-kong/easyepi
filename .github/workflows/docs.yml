name: docs

# Builds the MkDocs site and publishes it to GitHub Pages on every push to main.
# The site is generated here rather than committed, so the API reference always
# matches the code that is on the branch.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "easyepi/**"
      - "scripts/gen_docs.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and docs tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[bam,viz]"
          pip install mkdocs mkdocs-material "mkdocstrings[python]"

      - name: Regenerate command and API pages from the live parser
        # A renamed flag or a new subcommand must show up in the published reference.
        # The diff check fails the build instead of letting the docs drift.
        run: |
          python scripts/gen_docs.py
          if ! git diff --quiet docs/commands docs/api; then
            echo "::error::generated docs are stale; run scripts/gen_docs.py and commit"
            git diff --stat docs/commands docs/api
            exit 1
          fi

      - name: Run the test suite
        run: pytest tests -q

      - name: Build site (strict)
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
