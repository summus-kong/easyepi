name: docs

# Builds the MkDocs site on every push and publishes it to GitHub Pages.
#
# The build job is the verification: it regenerates the command/API pages from the
# live parser, fails if they differ from what is committed, and builds with
# `mkdocs build --strict` (any broken link or missing nav target is an error).
#
# The deploy job only runs on main and only when Pages has been enabled for the
# repository. It used to fail with `HttpError: Not Found` on every run because Pages
# was never switched on -- a repository setting, not a code defect -- which made a
# green build look like a red workflow and hid whether the docs were valid.
# `pages_enabled` probes that setting first so the outcome is honest:
#   - Pages on  -> build, deploy, publish
#   - Pages off -> build only, with a notice saying how to turn publishing on

on:
  push:
    branches: [main]
    paths:
      # The build regenerates the command/API pages from the parser and validates the
      # documented examples, so anything that can change either belongs here. Leaving
      # tests/ out made a test-only push leave the previous docs run as the latest
      # record: the site was built from an older commit while the branch tip was
      # something else, and "docs green" then referred to code that no longer existed.
      - "docs/**"
      - "mkdocs.yml"
      - "easyepi/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "easyepi/**"
      - "tests/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and docs tooling
        run: |
          python -m pip install --upgrade pip
          # dev brings pytest, which the test step needs. motif/activity are here so
          # the test step runs the same suite as the Linux job instead of skipping
          # the tests that import biopython or decoupler.
          pip install -e ".[bam,viz,states,activity,motif,dev]"
          pip install mkdocs mkdocs-material "mkdocstrings[python]"

      - name: Regenerate command and API pages from the live parser
        run: |
          python scripts/gen_docs.py
          if ! git diff --quiet docs/commands docs/api; then
            echo "::error::generated docs are stale; run scripts/gen_docs.py and commit"
            git diff --stat docs/commands docs/api
            exit 1
          fi

      - name: Run the test suite
        run: pytest tests -q

      - name: Check every documented example against the live parser
        run: python scripts/verify_doc_examples.py

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Probe whether Pages is enabled for this repository
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The Pages API returns 404 when publishing has never been enabled. That
          # is a configuration state, so it must not be reported as a build failure.
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled; the site will be published."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages not enabled::The site built successfully but was not published. Enable it under Settings -> Pages -> Source: GitHub Actions, then re-run this workflow."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
